[package]
name = "audiosous-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Native playback engine for Audiosous"
license = "UNLICENSED"

[dependencies]
cpal = "0.15"
rtrb = "0.3"
realfft = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flacenc = "0.4"
libloading = "0.8"
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "mp3", "pcm"] }
md-5 = "0.10"

