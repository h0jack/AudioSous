[project]
name = "audiosous-analysis"
version = "0.1.0"
description = "Local analysis sidecar for Audiosous. The desktop UI does not import this package."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiosous_analysis*"]
